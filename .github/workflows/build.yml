name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK
      run: |
        export GRADLE_USER_HOME="$HOME/.gradle"
        ./gradlew assembleRelease --no-daemon --no-build-cache --no-configuration-cache 2>&1 | { tee /tmp/build_output.txt; }
        echo "EXIT_CODE=$?"
    
    - name: Verify build output
      if: always()
      run: |
        echo "=== Gradle exit ==="
        tail -20 /tmp/build_output.txt 2>/dev/null || echo "No build output found"
        echo "=== APK search ==="
        find app/build -name "*.apk" 2>/dev/null || echo "No APK found"
        echo "=== Build reports ==="
        ls -la app/build/reports/ 2>/dev/null || echo "No reports"
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
