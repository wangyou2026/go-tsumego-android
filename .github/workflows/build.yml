name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK
      run: |
        export GRADLE_USER_HOME="$HOME/.gradle"
        set -o pipefail
        ./gradlew assembleRelease --no-daemon --no-build-cache --no-configuration-cache 2>&1 | tee /tmp/build_output.txt
    
    - name: Verify build output
      if: always()
      run: |
        echo "=== Last 30 lines of build ==="
        tail -30 /tmp/build_output.txt 2>/dev/null || echo "No output"
        echo "=== APK files ==="
        find app/build -name "*.apk" 2>/dev/null | head -5 || echo "No APKs"
        echo "=== Build reports ==="
        ls -la app/build/reports/ 2>/dev/null | head -10 || echo "No reports dir"
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
